name: Build Xiaomi Lamp 1S Matter Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile ESP32 Unicore Matter Binary
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space on Runner
        run: |
          echo "=== Free disk space before cleanup ==="
          df -h
          
          # Remove bulky preinstalled software to make room for esp-matter image
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/lib/jvm
          sudo apt-get purge -y azure-cli google-cloud-sdk microsoft-edge-stable firefox google-chrome-stable || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          docker system prune -a --volumes -f || true
          
          echo "=== Free disk space after cleanup ==="
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Firmware inside ESP-Matter Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -w /project \
            espressif/esp-matter:latest \
            bash -c "
              set -e
              git config --global --add safe.directory /project
              
              # Detect and activate IDF environment
              if [ -f /opt/espressif/esp-idf/export.sh ]; then
                . /opt/espressif/esp-idf/export.sh
                export ESP_MATTER_PATH=/opt/espressif/esp-matter
              elif [ -f /opt/esp/idf/export.sh ]; then
                . /opt/esp/idf/export.sh
                export ESP_MATTER_PATH=/opt/esp/esp-matter
              fi
              
              echo \"Using IDF_PATH: \$IDF_PATH\"
              echo \"Using ESP_MATTER_PATH: \$ESP_MATTER_PATH\"
              
              cd /project
              echo \"Current directory: \$(pwd)\"
              
              echo '=== Setting target to ESP32 ==='
              idf.py -C /project set-target esp32
              
              echo '=== Compiling firmware ==='
              idf.py -C /project build
              
              echo '=== Generating merged all-in-one flash binary ==='
              cd /project/build
              esptool.py --chip esp32 merge_bin -o merged-flash.bin @flash_args
              echo 'Merged binary created successfully.'
            "

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-lamp1s-matter-firmware
          path: |
            build/merged-flash.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/xiaomi_lamp_1s_matter.bin
            build/flasher_args.json
          if-no-files-found: error
